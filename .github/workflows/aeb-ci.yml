name: AEB CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install linting tool
        run: python -m pip install --disable-pip-version-check ruff==0.6.9
      - name: Compile Python files
        run: python -m compileall -q src scripts tests
      - name: Run linting
        run: ruff check src scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run simulation scenarios
        run: python -m scripts.run_aeb_scenarios